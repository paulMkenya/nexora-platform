{% extends 'affiliate_ui/base.html' %}
{% block title %}Password changed - {{ block.super }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header"><h2 class="card-title text-center">Password changed</h2></div>
      <div class="card-body text-center">
        <p>Your password has been updated. You can now log in with your new password.</p>
        <a href="{% url 'affiliate_ui:login' %}" class="btn btn-primary">Go to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
