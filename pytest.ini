[pytest]
# project.settings resolves to local.py or prod.py, so the suite used to run
# against whatever environment was loaded. With .env.prod — the documented way
# to run a one-off container — DJANGO_ALLOWED_HOSTS is set to the real domains
# and 8 tests across three files failed on DisallowedHost while being entirely
# correct. project.settings.test pins what the suite needs. See its docstring.
DJANGO_SETTINGS_MODULE = project.settings.test
python_files = tests.py test_*.py *_tests.py
# .claude/worktrees holds git worktrees of this same repo (Claude Code creates
# them for isolated branches). Collecting them gives pytest two copies of every
# test module under the same dotted path, which aborts the whole run with
# "import file mismatch" before a single test executes — an empty result that
# looks like a catastrophic failure. Never recurse into them.
norecursedirs = postback/postback .claude .git node_modules
