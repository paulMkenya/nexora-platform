<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payout Batches — Nexora Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
{% include 'admin_shared/nav.html' with active='payouts' %}
<div class="container-fluid py-4">
  <h2>Payout Batch History</h2>
  <p><a href="{% url 'payouts_admin:payout_list' %}">← Payout Requests</a></p>
  <table class="table table-sm table-striped bg-white">
    <thead>
      <tr><th>#</th><th>Provider</th><th>Total</th><th>Requests</th><th>Created</th></tr>
    </thead>
    <tbody>
      {% for b in batches %}
      <tr>
        <td>{{ b.pk }}</td>
        <td>{{ b.get_provider_display }}</td>
        <td>${{ b.total }}</td>
        <td>{{ b.requests.count }}</td>
        <td>{{ b.created_at }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="5" class="text-center text-muted">No batches yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
</body>
</html>
